---
# Ubuntu/Debian ship an old neovim, so we build the latest release from
# source. Arch and Fedora already ship a recent-enough neovim in their own
# repos, so they get the simpler branch below instead.
- name: Install latest neovim from source (Debian/Ubuntu)
  when: ansible_os_family == "Debian"
  block:
    - name: Check if neovim is installed via the package manager
      package_facts:
        manager: auto

    - name: Check if neovim is installed
      command:
        cmd: which nvim
      register: nvim
      changed_when: False
      failed_when: False

    - name: Check the nvim version if installed
      shell:
        cmd: "nvim --version | head -n 1 | cut -c 6-"
      register: neovim_version
      when: nvim.rc == 0
      changed_when: False

    - name: Set current neovim version to 0 if not installed
      set_fact:
        neovim_version:
          stdout: 0
      when: nvim.rc == 1

    - name: Install python3 and pip
      package:
        name:
          - python3
          - python3-pip
        state: latest

    - name: Install github3 module
      pip:
        name:
          - github3.py

    - name: Check latest neovim release
      github_release:
        user: neovim
        repo: neovim
        action: latest_release
        token: "{{ github_token }}"
      register: neovim_release
      changed_when: neovim_release.tag != neovim_version.stdout

    - name: Delete the old version of nvim via the package manager
      package:
        name: neovim
        state: absent
      when: "'neovim' in ansible_facts.packages and neovim_release.tag != neovim_version.stdout"

    - name: Install neovim
      when: neovim_release.tag != neovim_version.stdout
      block:
        - name: Check if the node repo is present
          stat:
            path: "/etc/apt/sources.list.d/nodesource.list"
          register: nodesource

        - name: Add the node repo
          shell:
            cmd: "curl -sL https://deb.nodesource.com/setup_16.x | bash -"
          when: not nodesource.stat.exists
          tags:
            - skip_ansible_lint

        - name: Add the yarn repo
          ansible.builtin.deb822_repository:
            name: yarn
            types: deb
            uris: https://dl.yarnpkg.com/debian/
            suites: stable
            components: main
            signed_by: https://dl.yarnpkg.com/debian/pubkey.gpg

        - name: Install the dependencies
          package:
            name:
              - golang
              - ninja-build
              - gettext
              - libtool
              - libtool-bin
              - autoconf
              - automake
              - cmake
              - g++
              - pkg-config
              - unzip
              - curl
              - doxygen
              - yarn
            state: present

        - name: Install python modules
          pip:
            name:
              - setuptools
              - pynvim

        - name: Grab the latest release source
          unarchive:
            src: "https://github.com/neovim/neovim/archive/{{ neovim_release['tag'] }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Get the neovim folder
          find:
            paths: /tmp
            patterns: "^neovim.*$"
            use_regex: yes
            file_type: directory
            recurse: no
          register: neovim_source

        - name: Compile and install neovim
          shell:
            cmd: cd {{ neovim_source.files[0].path }} && make install

        - name: Clean up
          file:
            path: "{{ neovim_source.files[0].path }}"
            state: absent

- name: Install neovim from the native package manager (Arch/Fedora)
  when: ansible_os_family in ["Archlinux", "RedHat"]
  block:
    - name: Install neovim, python and pip
      package:
        name:
          - neovim
          - "{{ python_pkg }}"
          - "{{ python_pip_pkg }}"
        state: latest

    - name: Install pynvim
      pip:
        name:
          - pynvim
