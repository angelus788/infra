---
# sudo_group is set per-OS in roles/system/vars/{{ ansible_os_family }}.yml
- name: Ensure the necessary groupsexists
  group:
    name: "{{ item }}"
    state: present
  # docker only where geerlingguy.docker runs (not on workstations, run.yml)
  loop: "{{ [username] + ([] if (workstation_mode | default(false)) else ['docker']) }}"
   
- name: Create a login user
  user:
    name: "{{ username }}"
    password: "{{ password | password_hash('sha512') }}"
    groups: "{{ [sudo_group, 'users'] + ([] if (workstation_mode | default(false)) else ['docker']) }}"
    state: present
    append: true

# Only the home directory itself. This used to recurse, which set every file
# under it - ~/.ssh private keys included - to 0755: world-readable, and ssh
# refuses to use a private key with those permissions.
- name: Chmod the user home directory
  ansible.builtin.file:
    path: "/home/{{ username }}"
    state: directory
    mode: "0755"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: Allow '{{ sudo_group }}' group to have passwordless sudo
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%{{ sudo_group }}'
    line: '%{{ sudo_group }} ALL=(ALL) NOPASSWD: ALL'
    validate: '/usr/sbin/visudo -cf %s'

- name: Copy the public SSH key 
  authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ ssh_public_key }}"

- name: Set the default shell
  user: 
    name: "{{ username }}"
    shell: "{{ shell }}"

- name: Disable fish greeting
  lineinfile:
    path: /home/{{ username }}/.config/fish/fish_variables
    state: present
    regexp: 'fish_greeting:.+'
    line: 'SETUVAR fish_greeting:'
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0644
  when: '"fish" in shell'

- name: Suppress login messages
  file:
    name: /home/{{ username }}/.hushlogin
    mode: 0644
    state: touch
    owner: "{{ username }}"
    group: "{{ username }}"
    modification_time: preserve
    access_time: preserve

- name: Disable cron e-mail notifications
  cron:
    name: MAILTO
    user: "{{ username }}"
    env: yes
    job: ""
