- name: Add netbird apt repository
  ansible.builtin.deb822_repository:
    name: netbird
    types: deb
    uris: https://pkgs.netbird.io/debian
    suites: stable
    components: main
    signed_by: https://pkgs.netbird.io/debian/public.key

- name: Install netbird
  ansible.builtin.apt:
    name: netbird
    update_cache: yes
