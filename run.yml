---
#
# Tasks and roles for all hosts
#
- hosts: fleet
  gather_facts: no

  pre_tasks:
      - import_tasks: tasks/ssh_juggle_port.yml
        tags:
            - always
            - port

- hosts: fleet
  become: yes

  pre_tasks:
      # Before the roles: geerlingguy.security moves sshd to security_ssh_port
      # and restarts it from a handler at the end of the roles section. Under
      # SELinux, sshd can't bind a port that isn't labeled ssh_port_t, and
      # firewalld would block it - as post_tasks, these ran after that restart,
      # which left a Fedora host with sshd down and no way back in over SSH.
      - import_tasks: tasks/redhat_ssh_firewall.yml
        when:
            - ansible_os_family == "RedHat"
            - security_ssh_port is defined
        tags:
            - security

  roles:
      #
      # Basics
      #
      - role: system
        tags:
            - system

      - role: neovim
        tags:
            - neovim

      - role: geerlingguy.security
        # No Archlinux support upstream
        when: ansible_os_family != "Archlinux"
        tags:
            - security

      - role: geerlingguy.docker
        # Not relevant on a workstation (group_vars/all/vars.yml)
        when: not (workstation_mode | default(false) | bool)
        tags:
            - docker

      - role: geerlingguy.ntp
        tags:
            - ntp

      - role: chriswayg.msmtp-mailer
        # Debian/Ubuntu only upstream - no Fedora or Arch support. Also not
        # relevant on a workstation (group_vars/all/vars.yml) - these alerts
        # are for SMART/snapraid on a server.
        when:
            - ansible_os_family == "Debian"
            - not (workstation_mode | default(false) | bool)
        tags:
            - msmtp

      - name: containers
        # Not relevant on a workstation (group_vars/all/vars.yml)
        when: not (workstation_mode | default(false) | bool)
        tags:
          - containers

      - role: tailscale
        when: tailscale_enabled | default(false) | bool
        tags:
            - tailscale

      - role: netbird
        when: netbird_enabled | default(false) | bool
        tags:
            - netbird
